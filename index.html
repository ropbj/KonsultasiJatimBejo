<!DOCTYPE html>
<html>
<head>
  <title>Portal Pengaduan</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: linear-gradient(135deg, #16a34a, #22c55e);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
      text-align: center;
    }
    .loader {
      border: 4px solid rgba(255,255,255,0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      margin: 20px auto;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div>
    <h1>Portal Pengaduan</h1>
    <p>Menghubungkan ke sistem...</p>
    <div class="loader"></div>
  </div>

  <script>
    setTimeout(() => {
      window.location.replace("LINK_WEB_APP_KAMU");
    }, 1000);
  </script>

</body>
</html>
